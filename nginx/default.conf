# 📋 CHANGELOG:
# ✅ Perubahan: Konfigurasi Nginx Reverse Proxy untuk meneruskan trafik HTTP Port 80 ke Next.js App Port 3000.
# ✨ Fitur Baru: Direct Static File Serving untuk folder uploads (CV, Surat Permohonan, Surat Balasan) & Client Max Body Size 10MB.
# 🎨 UI/UX Update: N/A (Web Server Configuration)
# 🔧 Bug Fix: Mencegah error HTTP 413 Payload Too Large saat user mengunggah berkas PDF/Gambar berukuran besar.
# 🚀 Inovasi: Optimized Edge Proxy Caching.

server {
    listen 80;
    server_name localhost;

    # Batas Maksimal Upload File (10 Megabyte)
    client_max_body_size 10M;

    # Forwarding Proxy ke Kontainer App
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Serving Langsung File Upload
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom Error Page
    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}