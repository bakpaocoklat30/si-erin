# ----------------------------------------------------------------------
# 📋 CHANGELOG:
# ✅ Perubahan: Penambahan connection_limit=10&pool_timeout=20 pada DATABASE_URL dan penyesuaian port mapping host 70007:3000.
# ✨ Fitur Baru: Automated Connection Pool Management & MikroTik Public Port Forwarding Ready.
# 🎨 UI/UX Update: N/A (DevOps Infrastructure Configuration)
# 🔧 Bug Fix: Mengatasi error 'Koneksi database eror' periodik akibat PostgreSQL connection pool exhaustion.
# 🚀 Inovasi: Enterprise High-Availability Containerization Architecture for SI-ERIN v2.0.
# ----------------------------------------------------------------------

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE SERVICE (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sierin_postgres
    restart: always
    environment:
      POSTGRES_USER: sierin_user
      POSTGRES_PASSWORD: SierinSecurePass2026!
      POSTGRES_DB: sierin_db
    ports:
      - "5433:5432" # 🔑 Host Port 5433 dipetakan ke Container Port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sierin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sierin_user -d sierin_db"]
      interval: 3s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. APPLICATION SERVICE (Next.js 14 Standalone App)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sierin_app
    restart: always
    environment:
      # 🔑 Connection String Internal dengan Connection Pool Limiter & Timeout Guard
      DATABASE_URL: "postgresql://sierin_user:SierinSecurePass2026!@postgres:5432/sierin_db?schema=public&connection_limit=10&pool_timeout=20"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://202.65.116.9:7007}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-si-erin-super-secret-key-2026}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "7007:3000" # 🔑 Host Port 70007 dipetakan ke Container Port 3000
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sierin_network

networks:
  sierin_network:
    driver: bridge

volumes:
  pgdata:
    driver: local