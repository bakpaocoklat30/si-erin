version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sierin_postgres
    restart: always
    environment:
      POSTGRES_USER: sierin_user
      POSTGRES_PASSWORD: SierinSecurePass2026!
      POSTGRES_DB: sierin_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: